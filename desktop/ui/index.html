<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horti Magici</title>
  <style>
    :root { color-scheme: light dark; --bg:#F7F2E8; --ink:#1d2b2a; --brand:#234A49; --soft:#5d6d6b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#142524; --ink:#F7F2E8; --brand:#E8B64A; --soft:#a9b9b6; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Segoe UI",sans-serif; text-align:center; }
    main { max-width: 28rem; }
    h1 { font:500 2.25rem Georgia,serif; letter-spacing:.18em; color:var(--brand); margin:0 0 1rem; }
    p { margin:.4rem 0; } .soft { color:var(--soft); font-size:.9rem; }
    button { margin:.9rem .25rem 0; height:44px; padding:0 26px; border:0; border-radius:999px; background:var(--brand); color:var(--bg); font:inherit; cursor:pointer; }
    button.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
    .dot { display:inline-block; width:.6rem; height:.6rem; border-radius:50%; background:var(--brand); margin-right:.5rem; animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity:.25; } }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <h1>HORTI MAGICI</h1>
    <section id="loading"><p><span class="dot"></span>Connessione in corso…</p></section>
    <section id="setup" hidden>
      <p>Prima di iniziare, indica l'indirizzo dell'app.</p>
      <p class="soft">Set the address of the app first.</p>
      <button id="open-settings">Apri le impostazioni</button>
    </section>
    <section id="offline" hidden>
      <p>Non riesco a raggiungere Horti Magici.</p>
      <p class="soft" id="offline-url"></p>
      <p class="soft">Controlla la connessione: riprovo da solo ogni 10 secondi. · Retrying every 10 seconds.</p>
      <button id="retry">Riprova ora</button>
      <button id="offline-settings" class="ghost">Impostazioni</button>
    </section>
  </main>
  <script>
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
    const show = (id) => { for (const s of document.querySelectorAll("section")) s.hidden = s.id !== id; };
    let timer;
    async function connect() {
      clearTimeout(timer);
      let cfg;
      try { cfg = await invoke("get_config"); } catch { return show("setup"); }
      if (!cfg.app_url) return show("setup");
      document.getElementById("offline-url").textContent = cfg.app_url;
      if (await invoke("reachable", { url: cfg.app_url })) {
        // from here on the hosted app has the window; it cannot call the shell
        location.replace(cfg.app_url);
      } else {
        show("offline");
        timer = setTimeout(connect, 10000);
      }
    }
    document.getElementById("retry").onclick = () => { show("loading"); connect(); };
    for (const id of ["open-settings", "offline-settings"]) document.getElementById(id).onclick = () => invoke("open_settings");
    connect();
  </script>
</body>
</html>
